services:
  - type: web
    name: healthchat-ai
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-20b"
      - key: DATABASE_URL
        fromDatabase:
          name: healthchat-db
          property: connectionString
    healthCheckPath: /api/health/

  - type: postgresql
    name: healthchat-db
    plan: free
    databaseName: healthchat
    ipAllowList: []
